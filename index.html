<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INBOX</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 0.3rem;
      margin-top: 0.9rem;
    }

    label:first-of-type { margin-top: 0; }

    input[type="text"], textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.65rem;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #58a6ff;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      gap: 0.75rem;
    }

    .row > * { flex: 1; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.55rem 1.1rem;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: #238636;
      color: #fff;
    }

    .btn-primary:not(:disabled):hover { background: #2ea043; }

    .btn-logout {
      background: none;
      color: #8b949e;
      border: 1px solid #30363d;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
    }

    .btn-logout:hover { color: #e6edf3; border-color: #8b949e; }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.1rem;
    }

    .status {
      font-size: 0.8rem;
      color: #8b949e;
      min-height: 1.2em;
    }

    .status.error { color: #f85149; }
    .status.ok    { color: #3fb950; }

    #auth-section, #form-section { display: none; }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.1rem;
      font-size: 0.82rem;
      color: #8b949e;
    }

    .user-bar img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .user-bar span { flex: 1; color: #e6edf3; }

    .create-token {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #8b949e;
      text-decoration: none;
    }

    .create-token:hover { color: #e6edf3; }
  </style>
</head>
<body>
<div class="card">
  <h1>INBOX</h1>

  <!-- Auth -->
  <div id="auth-section">
    <label for="token">Personal access token</label>
    <input type="text" id="token" placeholder="github_pat_…" autocomplete="off">
    <a class="create-token" id="create-token-link" href="#" target="_blank" rel="noopener">Create token →</a>

    <div class="actions">
      <div class="status" id="auth-status"></div>
      <button class="btn-primary" id="connect-btn">Connect</button>
    </div>
  </div>

  <!-- Idea form -->
  <div id="form-section">
    <div class="user-bar">
      <img id="user-avatar" src="" alt="">
      <span id="user-login"></span>
      <button class="btn-logout" id="logout-btn">Sign out</button>
    </div>

    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Idea title" autocomplete="off">

    <label for="project">Project <small style="color:#484f58">(optional)</small></label>
    <input type="text" id="project" placeholder="e.g. ideas-repo-tooling" autocomplete="off">

    <label for="body">Body</label>
    <textarea id="body" placeholder="Raw thought, unedited…"></textarea>

    <div class="actions">
      <div class="status" id="status"></div>
      <button class="btn-primary" id="submit-btn">Append</button>
    </div>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const REPO_OWNER = 'UnstoppableMango';
const REPO_NAME  = 'ideas';
const FILE_PATH  = 'INBOX.md';

const CREATE_TOKEN_URL = 'https://github.com/settings/personal-access-tokens/new?' + new URLSearchParams({
  name:        'INBOX capture',
  description: `Append access for ${REPO_OWNER}/${REPO_NAME} ${FILE_PATH}`,
  target_name: REPO_OWNER,
  contents:    'write',
  expires_in:  '90',
});

// ── Storage ────────────────────────────────────────────────────────────────
function getToken()  { return localStorage.getItem('gh_token'); }
function saveToken(t){ localStorage.setItem('gh_token', t); }
function clearAuth() { localStorage.removeItem('gh_token'); }

// ── GitHub API ─────────────────────────────────────────────────────────────
async function ghFetch(path, opts = {}) {
  const token = getToken();
  const res = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers ?? {}),
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw Object.assign(new Error(err.message ?? res.statusText), { status: res.status });
  }
  return res.json();
}

async function getUser() {
  return ghFetch('/user');
}

async function appendToInbox(markdown, retries = 3) {
  const url = `/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
  const file = await ghFetch(url);
  const current = atob(file.content.replace(/\n/g, ''));

  const separator = current.endsWith('\n\n') ? '' : current.endsWith('\n') ? '\n' : '\n\n';
  const updated = current + separator + markdown + '\n';

  try {
    await ghFetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `inbox: ${firstLine(markdown)}`,
        content: btoa(unescape(encodeURIComponent(updated))),
        sha:     file.sha,
      }),
    });
  } catch (e) {
    // Retry on conflict (concurrent edit changed sha)
    if (e.status === 409 && retries > 0) return appendToInbox(markdown, retries - 1);
    throw e;
  }
}

function firstLine(s) {
  return s.split('\n').find(l => l.trim()) ?? 'add idea';
}

// ── Formatting ─────────────────────────────────────────────────────────────
function formatEntry(title, project, body) {
  const date = new Date().toISOString().slice(0, 10);
  const lines = [];

  if (project) {
    lines.push(`## Project: ${project.trim()}`);
    lines.push('');
    lines.push(`### ${title.trim()}`);
  } else {
    lines.push(`## ${title.trim()}`);
  }

  lines.push(date);
  lines.push('');
  if (body.trim()) lines.push(body.trim());

  return lines.join('\n');
}

// ── UI ─────────────────────────────────────────────────────────────────────
function setStatus(msg, type = '', id = 'status') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className   = 'status' + (type ? ' ' + type : '');
}

async function showApp(token) {
  saveToken(token);
  let user;
  try {
    user = await getUser();
  } catch {
    clearAuth();
    showAuth();
    setStatus('Invalid or expired token.', 'error', 'auth-status');
    return;
  }

  setStatus('', '', 'auth-status');
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('user-avatar').src = user.avatar_url;
  document.getElementById('user-login').textContent = user.login;
  document.getElementById('title').focus();
}

function showAuth() {
  document.getElementById('form-section').style.display = 'none';
  document.getElementById('auth-section').style.display = 'block';
}

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  document.getElementById('create-token-link').href = CREATE_TOKEN_URL;

  async function connect() {
    const tokenInput = document.getElementById('token');
    const token = tokenInput.value.trim();
    if (!token) { setStatus('Token is required.', 'error', 'auth-status'); return; }

    const btn = document.getElementById('connect-btn');
    btn.disabled = true;
    setStatus('Connecting…', '', 'auth-status');
    await showApp(token);
    tokenInput.value = '';
    btn.disabled = false;
  }

  document.getElementById('connect-btn').addEventListener('click', connect);

  document.getElementById('token').addEventListener('paste', (e) => {
    const pasted = e.clipboardData?.getData('text');
    if (!pasted) return;
    setTimeout(connect, 0);
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    clearAuth();
    showAuth();
  });

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const title   = document.getElementById('title').value.trim();
    const project = document.getElementById('project').value.trim();
    const body    = document.getElementById('body').value;

    if (!title) { setStatus('Title is required.', 'error'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    setStatus('Appending…');

    try {
      await appendToInbox(formatEntry(title, project, body));
      setStatus('Appended ✓', 'ok');
      document.getElementById('title').value   = '';
      document.getElementById('project').value = '';
      document.getElementById('body').value    = '';
      document.getElementById('title').focus();
    } catch (e) {
      setStatus(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  if (getToken()) {
    await showApp(getToken());
  } else {
    showAuth();
  }
})();
</script>
</body>
</html>
